# netlify.toml — FeeWorth deploy configuration
#
# Branch deploys: pushing to "staging" creates a preview at
#   staging--cardsage.netlify.app
# Only "main" goes to the live production site (cardsage.co).

[build]
  publish = "."

# Enable branch deploys only for "staging" (not every random branch)
[context.production]
  command = ""

[context.staging]
  command = ""
