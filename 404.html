<!DOCTYPE html>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#ffffff;color:#0f172a;min-height:100vh;display:flex;flex-direction:column}
.nav{padding:18px 20px 14px;border-bottom:1px solid rgba(0,0,0,.06);text-align:center}
.logo{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:22px;font-weight:600;
  background:linear-gradient(135deg,#b8860b,#d4a840);-webkit-background-clip:text;-webkit-text-fill-color:transparent;

.content{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.card{text-align:center;max-width:400px}
.code{font-family:'Playfair Display',Georgia,serif;font-size:96px;font-weight:600;letter-spacing:-2px;

  background-clip:text;line-height:1;margin-bottom:16px}
.title{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:600;color:#0f172a;margin-bottom:12px}
.desc{font-size:14px;color:#6b7280;line-height:1.6;margin-bottom:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:12px;border:none;
  background:linear-gradient(135deg,#b8860b,#d4a840);color:#fff;font-family:'Inter',sans-serif;
  font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;
  box-shadow:0 2px 8px rgba(184,134,11,.25);transition:all .2s}
.btn:hover{box-shadow:0 4px 16px rgba(184,134,11,.35);transform:translateY(-1px)}
.footer{text-align:center;padding:16px 0 24px;border-top:1px solid #e5e7eb;font-size:11px;color:#9ca3af}
</style>
</head>

<div class="nav"><a href="/" class="logo">CardSage</a></div>

    <div class="title">Page not found</div>
